# Déploiement Netlify : site statique Astro.
# Variables à définir dans Netlify (Site configuration > Environment variables) :
#   SITE_URL = https://carsitting.fr
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  # Envoi des formulaires par Netlify Forms (Netlify > Forms) : voir src/scripts/forms.ts.
  PUBLIC_FORM_BACKEND = "netlify"
